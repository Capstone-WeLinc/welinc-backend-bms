name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bootstrap:ci
      # Fails on a known high or critical hole in what ships; dev tools are left out
      - run: npm run audit:ci
      # The Prisma client must exist before lint and build can see its types.
      - run: npm run typecheck
      # lint:ci checks only. npm run lint would fix files in place.
      - run: npm run lint:ci
      - run: npm run build
      - run: npm test
