version: 2
updates:
  # npm: one entry per service, each has its own package-lock.json
  - package-ecosystem: npm
    directories:
      - /bms-gateway
      - /bms-booking-service
      - /bms-dispatch-service
      - /bms-completion-service
      - /bms-analytics-projection
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
